# 정적 사이트 (빌드 없음). followkorea.kr은 GitHub Pages, gnfollow.com은 Netlify가 같은 repo를 서빙.
# 접속 도메인 감지(index.html의 SITE)로 gnfollow.com은 중국어 전용 + 유입 gnfollow 태깅.
[build]
  publish = "."
  command = ""

# 브라우저가 옛 버전 HTML을 캐시해 "최신이 안 뜨는" 문제 방지.
# max-age=0, must-revalidate → 브라우저가 매번 서버에 최신 여부를 확인(변경 없으면 304로 빠름).
# 단일 파일 HTML 사이트라 캐시할 별도 정적 에셋이 없어 성능 손해 없음.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # 검색엔진·AI 색인 차단 (2026-11-19)
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    # 보안 헤더 (클릭재킹/MIME 스니핑/레퍼러). 병원포털·백오피스 포함 프레이밍 차단.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

# 이 Netlify 사이트는 followkorea.kr과 gnfollow.com을 함께 서빙한다.
# 2026-11-19: 두 도메인 모두 검색·AI 색인 차단으로 전환 — sitemap.xml·llms.txt 삭제, robots는 차단본.
# 헤더는 도메인 구분이 안 되지만 양쪽 다 차단 대상이라 /* 에 X-Robots-Tag를 건다(위 headers 블록).
[[redirects]]
  from = "https://gnfollow.com/robots.txt"
  to = "/robots-gnfollow.txt"
  status = 200
  force = true
[[redirects]]
  from = "https://www.gnfollow.com/robots.txt"
  to = "/robots-gnfollow.txt"
  status = 200
  force = true
