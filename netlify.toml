# 정적 사이트 (빌드 없음). followkorea.kr은 GitHub Pages, gnfollow.com은 Netlify가 같은 repo를 서빙.
# 접속 도메인 감지(index.html의 SITE)로 gnfollow.com은 중국어 전용 + 유입 gnfollow 태깅.
[build]
  publish = "."
  command = ""

# 브라우저가 옛 버전 HTML을 캐시해 "최신이 안 뜨는" 문제 방지.
# max-age=0, must-revalidate → 브라우저가 매번 서버에 최신 여부를 확인(변경 없으면 304로 빠름).
# 단일 파일 HTML 사이트라 캐시할 별도 정적 에셋이 없어 성능 손해 없음.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # 보안 헤더 (클릭재킹/MIME 스니핑/레퍼러). 병원포털·백오피스 포함 프레이밍 차단.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

# GEO(AI 검색) — 이 Netlify 사이트는 followkorea.kr과 gnfollow.com을 함께 서빙한다.
# gnfollow.com에서만 중국어 전용 robots·사이트맵·llms.txt로 바꾼다(도메인 지정 규칙). followkorea.kr은 기본 파일 그대로.
# 헤더는 도메인별로 나눌 수 없으므로 noindex 헤더는 쓰지 않는다 — info/ 페이지는 canonical이 followkorea.kr이고 gnfollow robots가 /info/를 막는다.
# 파일 생성: node tools/build_geo_pages.cjs
[[redirects]]
  from = "https://gnfollow.com/robots.txt"
  to = "/robots-gnfollow.txt"
  status = 200
  force = true
[[redirects]]
  from = "https://gnfollow.com/sitemap.xml"
  to = "/sitemap-gnfollow.xml"
  status = 200
  force = true
[[redirects]]
  from = "https://gnfollow.com/llms.txt"
  to = "/llms-gnfollow.txt"
  status = 200
  force = true
[[redirects]]
  from = "https://www.gnfollow.com/robots.txt"
  to = "/robots-gnfollow.txt"
  status = 200
  force = true
[[redirects]]
  from = "https://www.gnfollow.com/sitemap.xml"
  to = "/sitemap-gnfollow.xml"
  status = 200
  force = true
[[redirects]]
  from = "https://www.gnfollow.com/llms.txt"
  to = "/llms-gnfollow.txt"
  status = 200
  force = true
